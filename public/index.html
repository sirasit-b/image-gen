<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0b0d" />
<title>Transparent Image Assets — Stillroom Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <!-- Mark: a decanter silhouette cut by the alpha checker line. -->
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9.5 2.75h5M10.25 2.75v3.9a3 3 0 0 1-.46 1.6l-2.6 4.1a3 3 0 0 0-.46 1.6v4.3a3 3 0 0 0 3 3h4.54a3 3 0 0 0 3-3v-4.3a3 3 0 0 0-.46-1.6l-2.6-4.1a3 3 0 0 1-.46-1.6v-3.9"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M7 14.6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.55" />
    </svg>
    Stillroom Studio
    <em>Asset Room</em>
  </div>

  <div class="settings">
    <label class="field">
      <span>โมเดล</span>
      <select id="model">
        <option value="gpt-image-2.5-flare">gpt-image-2.5-flare</option>
        <option value="gpt-image-2.5-sunburst">gpt-image-2.5-sunburst (คุณภาพสูงสุด)</option>
        <option value="gpt-image-1">gpt-image-1</option>
      </select>
    </label>
    <label class="field">
      <span>คุณภาพ</span>
      <select id="quality">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label class="toggle">
      <input type="checkbox" id="transparent" checked />
      <span>พื้นหลังโปร่งใส</span>
    </label>
  </div>
</header>

<main class="wrap">
  <div class="masthead">
    <h1>ภาพโปร่งใสชุดเดียว ใช้ได้ทุกแคมเปญ</h1>
    <p class="sub">
      สร้าง PNG ที่มี alpha channel จริง ตรวจความโปร่งใสทีละพิกเซล
      แล้วลองวางบนฉากจริง — ชั้นวางสินค้าตามฤดูกาล สไลด์องค์กร เทมเพลตดีไซน์ และ mockup เสื้อ
    </p>
  </div>

  <nav class="tabs" id="tabs" aria-label="ชุดงาน"></nav>
  <div id="views"></div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
